[package]
name = "essencial-servidor"
version = "0.1.0"
edition = "2024"
description = "Servidor de amigos do Essencial: lista de amigos, mensagens e convites para mundos do Horizon"
license = "MIT"
publish = false

[[bin]]
name = "essencial-servidor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
